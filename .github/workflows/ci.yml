name: CI Pipeline

on:
  push:
    branches: [ main, master, feature/reconstruction ]
  pull_request:
    branches: [ main, master, feature/reconstruction ]

permissions:
  contents: read

jobs:
  audit-test-build:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quikinvoice_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      PORT: 5001
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: quikinvoice_test
      DB_NAME_TEST: quikinvoice_test
      JWT_SECRET: ci_test_jwt_secret_key_at_least_32_chars_long_12345
      JWT_EXPIRES_IN: 24h
      COOKIE_SECRET: ci_cookie_secret_key_long_enough_12345
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Run Database Migrations (quikinvoice_test)
        run: npm --prefix server run migrate

      - name: Run Backend Test Suite
        run: npm --prefix server test

      - name: Build Frontend Production Bundle
        run: npm --prefix client run build
